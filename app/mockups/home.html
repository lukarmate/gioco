<!DOCTYPE html>
<!--
  MOCKUP Home — Gioco TCG (design-first, Task 0)
  Palette base spec UI: oro #c9a84c, gradiente #050508→#0c0618, viola cosmico, Cinzel.
  Scostamenti dalla base annotati qui se approvati: (nessuno per ora)
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gioco — Home (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c9a84c; --gold-dim:rgba(201,168,76,.6);
    --bg-top:#050508; --bg-bot:#0c0618; --cosmic:rgba(100,60,180,.6);
    --text:#e8e2d0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Cinzel',serif;gap:40px;flex-wrap:wrap;padding:30px}
  .phone{
    width:390px;height:844px;border-radius:38px;overflow:hidden;position:relative;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));
    box-shadow:0 0 0 10px #1a1a1a,0 30px 80px rgba(0,0,0,.7);
    display:flex;flex-direction:column;padding:0 16px;
  }
  /* glow cosmico di sfondo */
  .phone::before{content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);
    width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,var(--cosmic),transparent 65%);filter:blur(20px);opacity:.55;pointer-events:none}

  .header{text-align:center;margin-top:80px;position:relative;z-index:1}
  .title{font-size:46px;font-weight:700;color:var(--gold);letter-spacing:4px;
    text-shadow:0 0 18px rgba(201,168,76,.75)}
  .title .deco{opacity:.7;font-size:30px;vertical-align:middle}
  .subtitle{font-family:'Crimson Text',serif;font-style:italic;color:var(--gold-dim);
    font-size:16px;letter-spacing:1px;margin-top:6px}

  .menu{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative;z-index:1}
  .btn{border:1.5px solid var(--gold-dim);background:rgba(0,0,0,.5);border-radius:12px;
    color:var(--gold);font-family:'Cinzel',serif;font-weight:700;letter-spacing:1.5px;
    text-align:center;padding:18px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--gold)}
  .btn-primary{font-size:22px;padding:24px;border-color:var(--gold);
    background:rgba(201,168,76,.15);box-shadow:0 0 22px rgba(201,168,76,.45)}
  .btn-primary .ic{font-size:18px;margin-right:8px}
  .row{display:flex;gap:16px}
  .row .btn{flex:1;font-size:14px;line-height:1.4}
  .sub{display:block;font-weight:400;font-size:11px;opacity:.7;letter-spacing:1px;margin-top:3px}

  .footer{display:flex;justify-content:space-between;align-items:center;padding:18px 4px 34px;
    position:relative;z-index:1}
  .currency{color:var(--gold);font-size:11px;letter-spacing:.5px}
  .currency .dot{color:var(--gold-dim);margin:0 7px;font-size:8px;vertical-align:middle}
  .version{color:var(--gold-dim);font-size:13px}

  .caption{color:#888;font-family:system-ui;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
  <div>
    <div class="phone">
      <div class="header">
        <div class="title"><span class="deco">✦</span> GIOCO <span class="deco">✦</span></div>
        <div class="subtitle">dark fantasy tcg</div>
      </div>

      <div class="menu">
        <div class="btn btn-primary">G I O C A</div>
        <div class="row">
          <div class="btn">COLLEZIONE<span class="sub">&amp; Mazzi</span></div>
          <div class="btn">NEGOZIO<span class="sub">&amp; Battle Pass</span></div>
        </div>
        <div class="btn">IMPOSTAZIONI &amp; PROFILO</div>
      </div>

      <div class="footer">
        <div class="currency">Frammenti 1.2k<span class="dot">◆</span>Essenza 340<span class="dot">◆</span>Stelle 12</div>
        <div class="version">v1.0.0</div>
      </div>
    </div>
    <div class="caption">Home — menu principale (390×844)</div>
  </div>
</body>
</html>
